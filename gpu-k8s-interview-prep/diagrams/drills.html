<style>

<h1>Mock interview: leadership</h1>
<p class="sub">Hear the question, answer out loud for two minutes, then check the answer shape.</p>
<div class="chips" id="chips"></div>
<div class="card"><div class="cat" id="cat"></div><div class="q" id="q"></div>
<div class="row"><button class="b" id="ask">&#9654; Ask me</button><button class="b alt" id="start">Start 2:00 timer</button><button class="b alt" id="show">Show answer frame</button><button class="b alt" id="next">Next random</button><span class="timer" id="t">2:00</span></div>
<div class="ans" id="ans"></div><div class="cnt" id="cnt"></div></div>
<script>
const ITEMS=[{"id": "q1", "cat": "Opening", "q": "Tell me about yourself.", "testing": "clarity, fit", "ans": ["Shape: scope \u2192 how you lead \u2192 outcomes \u2192 why this role. 60-75 seconds.", "Sample: \"I've spent [N] years building and running platforms: [one-line scope, e.g. cloud-native platforms in regulated environments]. My strength is setting technical direction and standards, and growing the people who deliver. [One result with a number.] This role interests me because a multi-tenant GPU/AI platform combines platform engineering, scarce-hardware economics and enterprise delivery, and I want to lead that through strong team leads.\""]}, {"id": "q2", "cat": "Opening", "q": "Why do you want to move into a director role?", "testing": "motivation, realism", "ans": ["Answer: you get more impact through people and direction than through your own code, and you have already been doing it. Give one example where you led across teams. Avoid \"I want a bigger title\".", "Probe: \"What will you miss?\" \u2192 \"Hands-on coding. I stay close through design reviews and incident reviews.\""]}, {"id": "q3", "cat": "Opening", "q": "How would you describe your leadership style?", "testing": "self-awareness", "ans": ["Sample: \"Outcome-focused with high trust. I set clear goals and guardrails, then let leads own the how. I stay close enough through weekly 1:1s and shared dashboards to catch problems early. When things go wrong I go hard on the problem and soft on the person.\"", "Probe: \"Give me an example when that style failed.\" \u2192 have one ready (e.g., too hands-off, a lead struggled silently; you added earlier check-ins)."]}, {"id": "q4", "cat": "Opening", "q": "What would your team say about you?", "testing": "honesty", "ans": ["Give two strengths and one development area, each with evidence. Example: \"Clear on priorities, fair, protects the team from noise. They would also say I can take on too much myself, so I've been delegating more deliberately.\""]}, {"id": "q5", "cat": "Leading leads", "q": "How do you lead managers/leads rather than individual engineers?", "testing": "operating model", "ans": ["Shape: outcomes, rhythm, coaching, escalation.", "Sample: \"I agree outcomes and standards with each lead, then run a simple rhythm: weekly 1:1 with each lead, a short weekly delivery and risk review, monthly skip-levels with engineers, and a quarterly roadmap and capability review. I coach leads on decisions, not tasks, and I expect bad news early. I judge a lead by their team's delivery, quality and health, not by how busy they look.\""]}, {"id": "q6", "cat": "Leading leads", "q": "You join and inherit three team leads you don't know. First 30 days?", "testing": "judgement", "ans": ["Listen first. 1:1 with each lead and a few engineers; read incidents, roadmap and dashboards; map who owns what; find one painful problem to fix quickly so people see you act; set expectations in writing by day 30.", "Pitfall: announcing big changes in week one."]}, {"id": "q7", "cat": "Leading leads", "q": "A team lead is not delivering. What do you do?", "testing": "tough love, fairness", "ans": ["Facts first (outcomes, not impressions) \u2192 private, specific feedback with examples \u2192 agree a 30-60 day plan with support (coaching, reduced scope) \u2192 check weekly \u2192 decide fairly (role change or exit). Meanwhile protect the team: a senior engineer covers gaps.", "Probe: \"What if they are well-liked?\" \u2192 standards apply to everyone; the team is hurt more by a missing lead than by an honest decision."]}, {"id": "q8", "cat": "Leading leads", "q": "Two of your leads disagree on a technical direction. What do you do?", "testing": "conflict handling", "ans": ["Each writes the trade-offs against agreed criteria (risk, cost, time, operability) \u2192 short joint review \u2192 if no consensus, I decide, explain why, and record it in a design decision note \u2192 agree to revisit with data if it proves wrong."]}, {"id": "q9", "cat": "Leading leads", "q": "One of your leads disagrees with you in front of the team.", "testing": "ego", "ans": ["Listen, ask for the reasoning, thank them publicly if it's a good point and change course, or explain the constraint they may not see. Then a private chat: disagreement is welcome, but I ask for it early and with data."]}, {"id": "q10", "cat": "Leading leads", "q": "How do you decide what to delegate and what to review yourself?", "testing": "delegation", "ans": ["Delegate outcomes with clear guardrails. I personally review high-risk, hard-to-reverse decisions: architecture changes, security, data, major vendor commitments. For everything else I review samples and trust the leads' reviews."]}, {"id": "q11", "cat": "Leading leads", "q": "How do you avoid micromanaging yet stay informed?", "testing": "trust vs control", "ans": ["Shared dashboards and a weekly written status from leads (3 lines: done, risk, ask). I ask questions, not give instructions. I step in only when metrics or trust signals turn red."]}, {"id": "q12", "cat": "Leading leads", "q": "How do you manage someone more technical than you?", "testing": "humility", "ans": ["Be honest about what I don't know, use their expertise, and focus my value on direction, trade-offs, unblocking and growth. Ask \"what would you do and why?\" and challenge assumptions respectfully."]}, {"id": "q13", "cat": "Leading leads", "q": "How do you grow a good engineer into a lead?", "testing": "people development", "ans": ["Give a small scope to lead (a project), coach on planning, communication and feedback, let them run reviews, give honest feedback, document promotion criteria, and sponsor their visibility. Success is when they run without me."]}, {"id": "q14", "cat": "Leading leads", "q": "How do you build second-line leadership / succession?", "testing": "depth", "ans": ["Each lead has a named deputy, rotate technical-lead roles, cross-train, document critical knowledge, review the talent grid quarterly."]}, {"id": "q15", "cat": "People", "q": "Tell me about the toughest people situation you handled.", "testing": "courage, fairness", "ans": ["Pick a real one. STAR + Lesson. Emphasise: facts, early conversation, support, documentation, a fair outcome, impact on the team."]}, {"id": "q16", "cat": "People", "q": "A star performer says they will resign. What do you do?", "testing": "retention", "ans": ["Listen to the real reason first (growth, pay, manager, workload). Fix what is in my control (scope, growth path, recognition), escalate what isn't (compensation) with a business case, be honest about what I can't promise. If they still leave, make the handover clean and keep the relationship."]}, {"id": "q17", "cat": "People", "q": "How do you handle low morale or burnout in a team?", "testing": "empathy plus action", "ans": ["Notice early (1:1s, on-call load, overtime), ask directly, reduce the cause (scope, on-call rotation, unrealistic deadlines), protect recovery time, be transparent about constraints. Morale improves from clear priorities and fairness more than from perks."]}, {"id": "q18", "cat": "People", "q": "How do you manage vendors or contractors working beside your team?", "testing": "matrix and vendor skills", "ans": ["One accountable owner per deliverable, clear acceptance criteria, shared standards and tooling, joint planning, regular reviews, and a plan to keep knowledge in-house for critical parts."]}, {"id": "q19", "cat": "People", "q": "How do you hire? Describe a hire you are proud of.", "testing": "talent judgement", "ans": ["Define the outcomes first, structured interviews with a rubric, practical design discussion, hire for learning and ownership, close fast. Share one hire and what changed because of them."]}, {"id": "q20", "cat": "People", "q": "How do you give difficult feedback?", "testing": "directness", "ans": ["Soon, private, specific, about behaviour and impact, with a clear ask and support. Example format: \"In yesterday's review you [did X]. The impact was [Y]. What I need is [Z]. What would help you?\""]}, {"id": "q21", "cat": "Delivery", "q": "The deadline is impossible. What do you do?", "testing": "realism, courage", "ans": ["Quantify the gap \u2192 options (descope, add people carefully, move date, phase delivery) with trade-offs \u2192 agree with stakeholders early \u2192 protect quality gates \u2192 track weekly. Never hide a slip, never trade away security or data safety."]}, {"id": "q22", "cat": "Delivery", "q": "Production incident, 2 a.m. Walk me through your role.", "testing": "command under pressure", "ans": ["Make sure someone is the incident commander (maybe me, maybe a lead), roles are clear (comms, scribe, experts), mitigate before diagnosing (rollback or failover), update stakeholders every 30 minutes, avoid a crowd in the call. Afterwards: blameless review within days, actions with owners and dates, and I check they actually land.", "Probe: \"Was it your decision to roll back?\" \u2192 be ready with a real example."]}, {"id": "q23", "cat": "Delivery", "q": "A post-incident review points at one engineer's mistake. What do you do?", "testing": "culture", "ans": ["Ask what in the system allowed the mistake (missing guardrail, unclear process, pressure). Fix the system. Coach the engineer privately and support them publicly. Blame makes people hide problems."]}, {"id": "q24", "cat": "Delivery", "q": "Product wants features; engineers want to fix tech debt. How do you balance?", "testing": "prioritisation", "ans": ["Reserve a fixed capacity (for example 20 percent) for reliability and debt, make debt visible with business impact, and use error budgets: if reliability targets are being missed, reliability work goes first. Agree this with product in advance, not mid-crisis."]}, {"id": "q25", "cat": "Delivery", "q": "Scope keeps creeping on a platform project.", "testing": "discipline", "ans": ["Written scope and change control, impact on date and cost made visible each time, a clear owner who can say no, and a parking lot for the next phase."]}, {"id": "q26", "cat": "Delivery", "q": "How do you know your teams are delivering well?", "testing": "measurement", "ans": ["Delivery (lead time, deployment frequency, change failure rate, time to restore), reliability (SLO attainment, incidents), quality (escaped defects), people (attrition, engagement, on-call load), and for this platform: tenant onboarding time and GPU utilisation. I look at trends, and I never use metrics to rank individuals."]}, {"id": "q27", "cat": "Stakeholders", "q": "Product, security and operations want different things. How do you decide?", "testing": "influence", "ans": ["Start from shared goals, put the trade-offs and data on the table, one prioritised backlog, clear decision rights, and escalate with a recommendation, not a complaint. No surprises: share bad news early."]}, {"id": "q28", "cat": "Stakeholders", "q": "Tell me about a time you said no to a senior stakeholder.", "testing": "backbone", "ans": ["Acknowledge the goal, show cost and risk with numbers, offer alternatives (phase it, descope, new date), and keep the relationship. Result: they chose [alternative], or decided with eyes open."]}, {"id": "q29", "cat": "Stakeholders", "q": "How do you communicate bad news upward?", "testing": "transparency", "ans": ["Early, short, with facts, impact, options and a recommendation. \"Here's what happened, what it affects, what I propose, what I need from you.\""]}, {"id": "q30", "cat": "Stakeholders", "q": "How do you handle a stakeholder who bypasses you and goes to your engineers?", "testing": "boundaries and tact", "ans": ["Don't blame the stakeholder. Agree a single intake path (a lead or product owner), explain how it protects delivery, give them fast responses so they don't need to bypass, and coach the engineers to redirect politely."]}, {"id": "q31", "cat": "Strategy", "q": "How would you improve engineering maturity here?", "testing": "change leadership", "ans": ["Baseline first (delivery, quality, incidents, team survey), pick two or three highest-value changes (for example CI quality gates, release process, incident review), involve leads in designing them, automate rather than police, show results early."]}, {"id": "q32", "cat": "Strategy", "q": "You introduced a new standard and the team resisted. What next?", "testing": "influence", "ans": ["Understand the objection (it often has a point), pilot with a willing team, show the benefit with data, make the right way the easy way (templates, automation), adapt where the feedback is valid, hold the line where it is not."]}, {"id": "q33", "cat": "Strategy", "q": "The team has strong Java and Spring Boot skills but is new to GPU and AI infrastructure. How do you build the capability?", "testing": "capability building", "ans": ["Pair with internal or vendor experts, a small hands-on lab with a real use case, a learning path per role (platform, SRE, backend), reading groups and design reviews, bring in a short-term specialist to accelerate, and measure through delivered capability not training hours."]}, {"id": "q34", "cat": "Strategy", "q": "How do you balance strategy and hands-on oversight?", "testing": "this is in the JD", "ans": ["Most of my time on direction, people and delivery. I stay hands-on through design reviews, incident reviews and occasionally pairing on a hard problem, so I can still ask the question that exposes a risk."]}, {"id": "s1", "cat": "Scenario", "q": "A key customer's GPU jobs have been failing for two hours and a VP is asking for updates.", "testing": "C-P-A-C-L: clarify, prioritise, act, communicate, learn", "ans": ["Frame: clarify one or two facts, put people and risk first, act in three steps, say who hears what and when, then say how you prevent a repeat."], "scenario": true}, {"id": "s2", "cat": "Scenario", "q": "Your best lead resigns two weeks before a major release.", "testing": "C-P-A-C-L: clarify, prioritise, act, communicate, learn", "ans": ["Frame: clarify one or two facts, put people and risk first, act in three steps, say who hears what and when, then say how you prevent a repeat."], "scenario": true}, {"id": "s3", "cat": "Scenario", "q": "Security finds a critical vulnerability the day before launch.", "testing": "C-P-A-C-L: clarify, prioritise, act, communicate, learn", "ans": ["Frame: clarify one or two facts, put people and risk first, act in three steps, say who hears what and when, then say how you prevent a repeat."], "scenario": true}, {"id": "s4", "cat": "Scenario", "q": "Two teams both claim ownership of the scheduler/queueing layer.", "testing": "C-P-A-C-L: clarify, prioritise, act, communicate, learn", "ans": ["Frame: clarify one or two facts, put people and risk first, act in three steps, say who hears what and when, then say how you prevent a repeat."], "scenario": true}, {"id": "s5", "cat": "Scenario", "q": "The CEO asks for a demo of an AI feature in four weeks.", "testing": "C-P-A-C-L: clarify, prioritise, act, communicate, learn", "ans": ["Frame: clarify one or two facts, put people and risk first, act in three steps, say who hears what and when, then say how you prevent a repeat."], "scenario": true}, {"id": "s6", "cat": "Scenario", "q": "Engineers say on-call is unsustainable and two people are close to quitting.", "testing": "C-P-A-C-L: clarify, prioritise, act, communicate, learn", "ans": ["Frame: clarify one or two facts, put people and risk first, act in three steps, say who hears what and when, then say how you prevent a repeat."], "scenario": true}, {"id": "s7", "cat": "Scenario", "q": "A lead tells you privately that another lead's code is regularly breaking production.", "testing": "C-P-A-C-L: clarify, prioritise, act, communicate, learn", "ans": ["Frame: clarify one or two facts, put people and risk first, act in three steps, say who hears what and when, then say how you prevent a repeat."], "scenario": true}, {"id": "s8", "cat": "Scenario", "q": "A vendor misses a key delivery that blocks your milestone.", "testing": "C-P-A-C-L: clarify, prioritise, act, communicate, learn", "ans": ["Frame: clarify one or two facts, put people and risk first, act in three steps, say who hears what and when, then say how you prevent a repeat."], "scenario": true}], CATS=["All", "Opening", "Leading leads", "People", "Delivery", "Stakeholders", "Strategy", "Scenario"];
let pool=ITEMS, cur=null, tm=null, left=120; const $=id=>document.getElementById(id), audio=new Audio();
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function stop(){clearInterval(tm);tm=null;left=120;$('t').textContent='2:00';$('t').className='timer'}
function show(it){cur=it;stop();audio.pause();$('cat').textContent=it.cat;$('q').textContent=it.q;$('ans').style.display='none';
 $('ans').innerHTML='<b>Testing:</b> '+esc(it.testing)+it.ans.map(a=>'<p>'+esc(a)+'</p>').join('');$('cnt').textContent=pool.length+' in this set'}
function next(){let it;do{it=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&it===cur);show(it);ask()}
function ask(){audio.src='audio/drill-'+cur.id+'.mp3';audio.play().catch(()=>{})}
$('ask').onclick=ask;$('next').onclick=next;$('show').onclick=()=>{$('ans').style.display='block'};
$('start').onclick=()=>{if(tm){stop();return}tm=setInterval(()=>{left--;const m=Math.floor(left/60),s=left%60;$('t').textContent=m+':'+String(s).padStart(2,'0');if(left<=20)$('t').className='timer low';if(left<=0){stop();$('t').textContent='Time'}},1000)};
CATS.forEach((c,i)=>{const b=document.createElement('button');b.className='chip'+(i?'':' on');b.textContent=c;b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');pool=c=='All'?ITEMS:ITEMS.filter(x=>x.cat==c);show(pool[Math.floor(Math.random()*pool.length)])};$('chips').appendChild(b)});
show(ITEMS[0]);
</script></body></html>
