# Dynamic Resource Allocation (core GA since Kubernetes 1.34, API group resource.k8s.io/v1).
# Requires the NVIDIA DRA driver (kubernetes-sigs/dra-driver-nvidia-gpu); GPU allocation via DRA is opt-in:
#   kubectl label node <n> nvidia.com/dra-kubelet-plugin=true
# DeviceClasses gpu.nvidia.com and mig.nvidia.com are installed by the driver chart.
# Attribute / capacity names depend on driver version: inspect with `kubectl get resourceslices -o yaml`.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: big-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            selectors:
              - cel:
                  expression: >-
                    device.capacity['gpu.nvidia.com'].memory.compareTo(quantity('40Gi')) >= 0
---
apiVersion: v1
kind: Pod
metadata:
  name: dra-demo
spec:
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: big-gpu   # one claim generated per Pod
  containers:
    - name: app
      image: nvcr.io/nvidia/cuda:12.4.1-base-ubuntu22.04
      command: ["nvidia-smi"]
      resources:
        claims:
          - name: gpu
